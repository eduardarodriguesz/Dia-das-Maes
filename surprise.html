<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Surpresa</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="surprise-page">
    <div class="mobile-container">
        <header>
            <h1>Para Você, Mamãe</h1>
        </header>
        
        <div class="cards-grid">
            <!-- Card 1 -->
            <div class="card" data-message="Você é a luz da minha vida!">
                <div class="card-inner">
                    <div class="card-front">❤️</div>
                    <div class="card-back">Você é a luz da minha vida!</div>
                </div>
            </div>
            <!-- Card 2 -->
            <div class="card" data-message="Obrigado por tudo o que faz.">
                <div class="card-inner">
                    <div class="card-front">🌸</div>
                    <div class="card-back">Obrigado por tudo o que faz.</div>
                </div>
            </div>
            <!-- Card 3 -->
            <div class="card" data-message="Meu maior exemplo de força.">
                <div class="card-inner">
                    <div class="card-front">✨</div>
                    <div class="card-back">Meu maior exemplo de força.</div>
                </div>
            </div>
            <!-- Card 4 -->
            <div class="card" data-message="Te amo infinitamente!">
                <div class="card-inner">
                    <div class="card-front">💎</div>
                    <div class="card-back">Te amo infinitamente!</div>
                </div>
            </div>
            <!-- Card 5 -->
            <div class="card" data-message="Você merece o mundo.">
                <div class="card-inner">
                    <div class="card-front">🎁</div>
                    <div class="card-back">Você merece o mundo.</div>
                </div>
            </div>
            <!-- Card 6 -->
            <div class="card" data-message="Sempre estarei aqui por você.">
                <div class="card-inner">
                    <div class="card-front">🌟</div>
                    <div class="card-back">Sempre estarei aqui por você.</div>
                </div>
            </div>
        </div>
    </div>
    <div id="confetti-container"></div>
    <script src="script.js"></script>
</body>
</html>
